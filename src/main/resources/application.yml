server:
  port: 8084
  forward-headers-strategy: framework
  description: 获取Token，API权限等

spring:
  application:
    name: peach-auth-service
    module-code: AUTH
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.99.100:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}
        port: ${NACOS_REGISTER_PORT:${server.port}}
        fail-fast: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.99.100:5432/peach_common?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

peach:
  jwt:
    # 访问令牌有效期（秒）；未配置时 UserServiceImpl 中 @Value 默认 3600，此处可覆盖
    expires-in: ${PEACH_JWT_EXPIRES_IN:3600}
  auth:
    slider:
      cleanup-interval-ms: 60000

springdoc:
  cache:
    disabled: true
  swagger-ui:
    path: /swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
